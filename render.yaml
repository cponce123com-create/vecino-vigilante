# ═══════════════════════════════════════════════════════════════════
# render.yaml — Blueprint de Vecino Vigilante
# ═══════════════════════════════════════════════════════════════════
#
# Este archivo define TODA la infraestructura en Render:
# - 1 Web Service (backend API)
# - 1 Web Service (Python microservice)
# - 1 Static Site (frontend React)
#
# La base de datos NO está aquí porque usas Neon (externa).
#
# Render detectará este archivo automáticamente cuando conectes
# el repo como "Blueprint Instance".
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────
  # BACKEND — API Server (Express + Node)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: vecino-vigilante-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .

    # Build: esbuild empaqueta todo, no necesita node_modules en runtime
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      pnpm install --filter @workspace/api-server --no-frozen-lockfile &&
      pnpm --filter @workspace/api-server run build

    # Start: el bundle es standalone, no necesita pnpm
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs

    # Health check
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "24"

      - key: DATABASE_URL
        sync: false

      - key: SYNC_SECRET
        sync: false

      - key: OCDS_API_BASE
        value: https://contratacionesabiertas.osce.gob.pe/api

  # ─────────────────────────────────────────────────────────────────
  # PYTHON MICROSERVICE — NLP + Cloudinary
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: vecino-vigilante-python
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: services/python-microservice

    buildCommand: |
      pip install --no-cache-dir -r requirements.txt &&
      python -m spacy download es_core_news_lg

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: NODEJS_API_URL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: TELEGRAM_SESSION
        sync: false

  # ─────────────────────────────────────────────────────────────────
  # FRONTEND — Static Site (React + Vite)
  # ─────────────────────────────────────────────────────────────────
  - type: staticSite
    name: vecino-vigilante-web
    plan: free
    branch: main
    rootDir: .

    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/vecino-vigilante run build

    staticPublishPath: ./artifacts/vecino-vigilante/dist/public

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      - key: VITE_API_BASE_URL
        sync: false
