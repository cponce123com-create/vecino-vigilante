<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pegar Conversación - Vecino Vigilante</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f8f5; color: #1a1a1a; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1e3a5f; }
  p { color: #56565f; margin-bottom: 16px; font-size: 0.9rem; }
  textarea { width: 100%; height: 300px; padding: 12px; border: 1px solid #e4e4e9; border-radius: 8px; font-family: monospace; font-size: 13px; resize: vertical; }
  button { background: #c0192a; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 12px; }
  button:hover { background: #a01523; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .results { margin-top: 20px; }
  .results pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 500px; overflow-y: auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; border: 1px solid #e4e4e9; border-radius: 8px; padding: 12px; text-align: center; }
  .stat-card .num { font-size: 1.5rem; font-weight: bold; color: #c0192a; }
  .stat-card .label { font-size: 0.8rem; color: #56565f; }
  .error { color: #c0192a; background: #fef2f2; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .config { margin: 12px 0; display: flex; gap: 12px; align-items: center; }
  .config label { font-size: 0.85rem; color: #56565f; }
  .config input { width: 300px; padding: 8px 12px; border: 1px solid #e4e4e9; border-radius: 6px; font-size: 0.85rem; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.85rem; background: #e4e4e9; }
  .tab.active { background: white; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Pegar conversación</h1>
  <p>Copia y pega la conversación completa de Telegram (LEDER DATA, etc.) para extraer personas, relaciones y etiquetas.</p>

  <div class="config">
    <label>URL del microservicio:</label>
    <input id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
  </div>

  <textarea id="conversacion" placeholder="Pega aquí la conversación completa..."></textarea>
  <div style="display:flex; gap:8px; align-items:center; margin-top:12px;">
    <button id="btnProcesar" onclick="procesar()">🔍 Procesar conversación</button>
    <label style="font-size:0.85rem;color:#56565f">
      <input type="checkbox" id="usarNLP" checked> Usar NLP adicional
    </label>
  </div>
  <div id="error" class="error" style="display:none"></div>

  <div class="results" id="results" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('entidades')">Personas</div>
      <div class="tab" onclick="switchTab('relaciones')">Relaciones</div>
      <div class="tab" onclick="switchTab('etiquetas')">Etiquetas</div>
      <div class="tab" onclick="switchTab('empresas')">Empresas</div>
      <div class="tab" onclick="switchTab('vehiculos')">Vehículos</div>
    </div>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<script>
let lastResult = null;

async function procesar() {
  const texto = document.getElementById('conversacion').value.trim();
  if (!texto) { alert('Pega la conversación primero'); return; }

  const apiUrl = document.getElementById('apiUrl').value.trim();
  const usarNLP = document.getElementById('usarNLP').checked;
  const btn = document.getElementById('btnProcesar');
  const errorDiv = document.getElementById('error');

  btn.disabled = true;
  btn.textContent = '⏳ Procesando...';
  errorDiv.style.display = 'none';

  try {
    const res = await fetch(apiUrl + '/procesar_conversacion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto, usar_nlp: usarNLP }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    lastResult = await res.json();
    showResults(lastResult);
  } catch (e) {
    errorDiv.textContent = 'Error: ' + e.message;
    errorDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Procesar conversación';
  }
}

function showResults(data) {
  document.getElementById('results').style.display = 'block';
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${data.entidades?.length || 0}</div><div class="label">Personas</div></div>
    <div class="stat-card"><div class="num">${data.relaciones?.length || 0}</div><div class="label">Relaciones</div></div>
    <div class="stat-card"><div class="num">${data.etiquetas?.length || 0}</div><div class="label">Etiquetas</div></div>
    <div class="stat-card"><div class="num">${data.empresas?.length || 0}</div><div class="label">Empresas</div></div>
    <div class="stat-card"><div class="num">${data.vehiculos?.length || 0}</div><div class="label">Vehículos</div></div>
  `;
  switchTab('entidades');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (!lastResult) return;
  const data = lastResult[tab] || [];
  document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
